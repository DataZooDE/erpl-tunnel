# Self-hosted NetBird control plane WITHOUT an IdP (management IdpManagerConfig:none)
# + a real kernel-TUN peer, for the mesh data-plane test (Tier 2). The management
# store is pre-seeded (seeder/) from NetBird's own store.sql fixture, which carries
# an account with a network and a reusable setup key
# (plaintext A2C8E62B-38F5-4553-B31E-DD66C696CEBB) — so peers enroll with no IdP.
#
# Fixed subnet so node A's container and the peer share one L2 and connect via DIRECT
# WireGuard (same trick as the Tailscale test), sidestepping relay reachability.
networks:
  mesh:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

services:
  signal:
    image: netbirdio/signal:latest
    container_name: erpl-nb-signal
    networks: [mesh]
    command: ["--port", "10000", "--log-level", "info"]

  relay:
    image: netbirdio/relay:latest
    container_name: erpl-nb-relay
    networks: [mesh]
    environment:
      NB_LOG_LEVEL: info
      NB_LISTEN_ADDRESS: ":33080"
      NB_EXPOSED_ADDRESS: "rel://172.28.0.1:33080"
      NB_AUTH_SECRET: "netbirdnetbirdnetbirdnetbird"
    ports:
      - "33080:33080"

  management:
    image: netbirdio/management:latest
    container_name: erpl-nb-management
    networks: [mesh]
    depends_on: [signal, relay]
    command:
      - "--port"
      - "80"
      - "--log-level"
      - "info"
      - "--disable-anonymous-metrics"
      - "--single-account-mode-domain"
      - "netbird.selfhosted"
      - "--dns-domain"
      - "netbird.selfhosted"
      - "--config"
      - "/var/lib/netbird/management.json"
    ports:
      - "33073:80"
    volumes:
      # mgmt-data (writable) holds both the seeded store.db AND a writable copy of
      # management.json (management rewrites it to persist a store-encryption key).
      - ./mgmt-data:/var/lib/netbird

  # Node B: the OFFICIAL netbird daemon with a real kernel-TUN interface.
  nb-peer:
    image: netbirdio/netbird:latest
    container_name: erpl-nb-peer
    hostname: nb-peer
    networks: [mesh]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY:-}
      NB_MANAGEMENT_URL: http://management:80
      NB_HOSTNAME: nb-peer
      NB_LOG_LEVEL: info
      # Force NetBird's Go userspace packet filter instead of iptables+ipset. The
      # iptables backend is default-drop and its ACL allow-rules need `hash:net`
      # ipsets; if the host kernel lacks the ip_set_hash_net module, ipset creation
      # fails, 0 rules apply, and ALL overlay data is dropped even though WireGuard
      # connects. uspfilter applies the ACL in Go, kernel-module-independent.
      NB_FORCE_USERSPACE_FIREWALL: "true"
    depends_on: [management]
    profiles: [peer]

  nb-peer-svc:
    image: python:3.12-slim
    container_name: erpl-nb-peer-svc
    network_mode: "service:nb-peer"
    working_dir: /assets
    command: python -m http.server 8000
    volumes:
      - ../headscale/assets:/assets:ro
    depends_on: [nb-peer]
    profiles: [peer]

