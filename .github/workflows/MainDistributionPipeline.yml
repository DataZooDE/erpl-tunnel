#
# Build, test, and deploy the erpl_tunnel DuckDB extension across platforms and
# DuckDB versions. Same flow as erpl / erpl-idoc.
#
# NOTE: mesh backends (Tailscale/NetBird) add a Go `c-shared` build step per target
# arch in later milestones; the SSH-only build below carries no Go.
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write  # required for AWS OIDC in the deploy job
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # ---- DuckDB v1.5.4 ---------------------------------------------------------
  duckdb-v154-build:
    name: Build & test (v1.5.4)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: erpl_tunnel
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      extra_toolchains: 'go'   # published artifact is MESH_BACKEND=both (tsnet/netbird shims)
      reduced_ci_mode: 'disabled'   # build the FULL matrix (linux+osx+windows), not just linux
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'   # mingw excluded: upstream MSYS2 libtool-2.4.7-4 404 breaks openssl:x64-mingw-static
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()
        # Our own pipeline must never publish a silently SSH-only Windows artifact:
        # without a mingw toolchain the mesh build degrades on purpose (so third-party
        # builders still get something), and that would otherwise pass as green here.
        set(ERPL_REQUIRE_MESH ON)

  duckdb-v154-deploy:
    name: Deploy (v1.5.4)
    needs: duckdb-v154-build
    # Self-hosted S3 distribution runs only on release tags. Day-to-day pushes are
    # build+test only; primary distribution is via duckdb community-extensions.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.4
      extension_name: erpl_tunnel
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'   # mingw excluded: upstream MSYS2 libtool-2.4.7-4 404 breaks openssl:x64-mingw-static
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  # ---- DuckDB v1.4.5 (latest-2 support window) -------------------------------
  duckdb-v145-build:
    name: Build & test (v1.4.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: erpl_tunnel
      vcpkg_commit: ce613c41372b23b1f51333815feb3edd87ef8a8b
      extra_toolchains: 'go'   # published artifact is MESH_BACKEND=both (tsnet/netbird shims)
      reduced_ci_mode: 'disabled'   # build the FULL matrix (linux+osx+windows), not just linux
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'   # mingw excluded: upstream MSYS2 libtool-2.4.7-4 404 breaks openssl:x64-mingw-static
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()
        # Our own pipeline must never publish a silently SSH-only Windows artifact:
        # without a mingw toolchain the mesh build degrades on purpose (so third-party
        # builders still get something), and that would otherwise pass as green here.
        set(ERPL_REQUIRE_MESH ON)

  duckdb-v145-deploy:
    name: Deploy (v1.4.5)
    needs: duckdb-v145-build
    # Self-hosted S3 distribution runs only on release tags. Day-to-day pushes are
    # build+test only; primary distribution is via duckdb community-extensions.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.5
      extension_name: erpl_tunnel
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'   # mingw excluded: upstream MSYS2 libtool-2.4.7-4 404 breaks openssl:x64-mingw-static
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
