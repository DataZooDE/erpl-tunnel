#
# Build, test, and deploy the erpl_tunnel DuckDB extension across platforms and
# DuckDB versions. Same flow as erpl / erpl-idoc.
#
# NOTE: mesh backends (Tailscale/NetBird) add a Go `c-shared` build step per target
# arch in later milestones; the SSH-only build below carries no Go.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write  # required for AWS OIDC in the deploy job
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # ---- DuckDB v1.5.6 ---------------------------------------------------------
  duckdb-v154-build:
    name: Build & test (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: erpl_tunnel
      # Matches upstream's default. The older ce613c41 fetches
      # msys2-runtime-3.5.4-2, which msys2 purged from every mirror (all 404), so Windows
      # fails deterministically there (cf. DataZooDE/erpl#115).
      #
      # This pin alone is not enough: it ships openssl 3.6.0, which requires Linux kernel
      # headers the arm64 container does not carry, so arm64 fails with "building
      # openssl:arm64-linux-release failed with: BUILD_FAILED". vcpkg.json therefore holds
      # openssl at 3.5.0 -- see the override there. Both halves are required; changing
      # either alone turns one platform red.
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      extra_toolchains: 'go'   # published artifact is MESH_BACKEND=both (tsnet/netbird shims)
      reduced_ci_mode: 'disabled'   # build the FULL matrix (linux+osx+windows), not just linux
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'   # mingw excluded: upstream MSYS2 libtool-2.4.7-4 404 breaks openssl:x64-mingw-static
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()
        # Our own pipeline must never publish a silently SSH-only Windows artifact:
        # without a mingw toolchain the mesh build degrades on purpose (so third-party
        # builders still get something), and that would otherwise pass as green here.
        set(ERPL_REQUIRE_MESH ON)

  duckdb-v154-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v154-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_tunnel
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'

  duckdb-v154-deploy:
    name: Deploy (v1.5.6)
    needs: [duckdb-v154-build, duckdb-v154-smoke-test]
    # Self-hosted S3 distribution runs only on release tags. Day-to-day pushes are
    # build+test only; primary distribution is via duckdb community-extensions.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      # The deploy matrix must come from the build's own ci-tools line: the repo's
      # extension-ci-tools submodule is on v2.0-cyanoptera, which has no osx_amd64.
      ci_tools_version: v1.5-variegata
      extension_name: erpl_tunnel
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'   # mingw excluded: upstream MSYS2 libtool-2.4.7-4 404 breaks openssl:x64-mingw-static
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      # The job-level `if:` already limits this job to tags; this keeps it safe if
      # that gate is ever widened.
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # ---- DuckDB v2.0.1 ---------------------------------------------------------
  duckdb-v201-build:
    name: Build & test (v2.0.1)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: erpl_tunnel
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      extra_toolchains: 'go'
      reduced_ci_mode: 'disabled'   # build the FULL matrix on PRs too, so the smoke test finds every artifact
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()
        set(ERPL_REQUIRE_MESH ON)

  duckdb-v201-smoke-test:
    name: Smoke test (v2.0.1)
    needs: duckdb-v201-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.1
      extension_name: erpl_tunnel
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'

  duckdb-v201-deploy:
    name: Deploy (v2.0.1)
    needs: [duckdb-v201-build, duckdb-v201-smoke-test]
    # Same gate as the v1.5.6 line: self-hosted S3 distribution only on release tags.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: erpl_tunnel
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths come ONLY from the tag run (release deploy race, see the
      # v1.5.6 deploy job).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
