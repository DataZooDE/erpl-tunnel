#
# Mesh backend proofs — the tests that need Go + docker (Headscale) and are not
# part of the release distribution matrix. Runs the de-risking spike, the lazy
# zero-Go proof, the single-mesh latch, and real Tailscale enrollment.
#
name: Mesh backend tests
on:
  push:
    paths:
      - 'shim/**'
      - 'src/mesh_*'
      - 'cmake/**'
      - 'test/integration/**'
      - 'Makefile'
      - '.github/workflows/mesh-tests.yml'
  pull_request:
    paths:
      - 'shim/**'
      - 'src/mesh_*'
      - 'cmake/**'
      - 'test/integration/**'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Pure C++ unit tests (mesh-peers JSON parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Compile and run the DuckDB-free Catch2 core tests
        run: make core_tests

  # The cheapest signal in the whole mesh suite, and the only one that covers the
  # platform-specific stream-pair logic directly. shim/meshpair has no cgo, no mesh
  # libraries and no DuckDB, so this runs in seconds on every OS — including the
  # Windows loopback pair, whose accept-matching and half-close semantics are the
  # trickiest new code in the Windows port.
  meshpair:
    name: Stream pair unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # >= 1.26 is mandatory: Go 1.25.x silently fails to run init() in c-shared
        # DLLs loaded via LoadLibrary on Windows (golang/go#75949).
        with: { go-version: '1.26.4' }
      - name: go vet
        working-directory: shim/meshpair
        run: go vet ./...
      - name: go test (race)
        working-directory: shim/meshpair
        run: go test -race -count=2 ./...

  # SSH is the one backend that ships on every platform, and until now nothing in CI
  # exercised it: the live-SSH sqllogictests self-skip without ERPL_SSH_HOST, so every
  # run reported "4 skipped" and no bytes ever crossed an SSH tunnel in CI. This job
  # brings up the dockerised bastion + private HTTP service and pushes a real payload
  # through, plus the four integration tests that were skipping.
  ssh-e2e:
    name: SSH data plane (real bastion, real payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      # SSH-only: no Go, no mesh — this is deliberately the cheapest build that can
      # still prove the SSH data path, and it doubles as a check that the mesh code
      # really is compiled out (ERPL_TUNNEL_HAS_MESH) rather than merely unused.
      - name: Build (MESH_BACKEND=ssh)
        env: { MESH_BACKEND: ssh, GEN: ninja }
        run: make debug
      - name: Bring up the SSH bastion + private HTTP service
        run: make test_up
      - name: Real HTTP payload through an SSH tunnel
        run: make e2e
      # The reverse direction: publish a LOCAL http server onto the bastion with
      # tunnel_export and fetch it from INSIDE the container. Same harness, so this
      # is nearly free, and it is the only CI coverage of libssh2 remote-forward.
      - name: Real HTTP payload OUT of DuckDB over an SSH remote-forward
        run: make ssh_export_e2e
      - name: Live-SSH integration tests (these skip without the harness)
        env:
          ERPL_SSH_HOST: 127.0.0.1
          ERPL_SSH_PORT: '2222'
          ERPL_SSH_USER: root
          ERPL_SSH_PASSWORD: testpass
        run: |
          set -e
          # tunnel_export.test is mesh-independent (argument validation + the SSH
          # path only), so it belongs in this SSH-only job. tunnel_secret_by_name.test
          # deliberately is NOT here — it needs a mesh build to have a mesh secret to
          # discriminate against.
          for t in test/sql/sap_tunnel_basic.test \
                   test/sql/sap_tunnel_integration_password.test \
                   test/sql/sap_tunnel_integration_key.test \
                   test/sql/tunnel_export.test \
                   test/sql/tunnel_loopback_bind.test; do
            echo "== $t =="
            # One at a time: these all bind local_port 9000, so a shared runner needs
            # the previous listener fully released before the next starts.
            build/debug/test/unittest "$t"
            sleep 2
          done
      - name: Tear down
        if: always()
        run: make test_down

  # NFR-1: the shipped file is self-contained. Loads the extension in a minimal
  # glibc container with nothing installed beyond a stock DuckDB — no libssh2, no
  # OpenSSL, no Go runtime, no tailscale/netbird daemon. Built MESH_BACKEND=both so
  # the embedded Go shims are actually present in the artifact under test.
  zero-dep:
    name: Zero-dependency proof (NFR-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.4' }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - name: Build release (MESH_BACKEND=both)
        env: { MESH_BACKEND: both, GEN: ninja }
        run: make release
      - name: Load in a bare container
        # ubuntu-latest builds on a rolling glibc, so the probe image has to match or
        # newer; the published artifact is built on manylinux and runs anywhere.
        run: BASE_IMAGE=ubuntu:24.04 make zero_dep

  spike:
    name: Go-in-dlopen spike (R1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Build Tailscale shim + run dlopen spike
        run: make spike

  # The Windows go/no-go: can a mingw-built Go c-shared DLL be LoadLibrary'd by an
  # MSVC host and actually RUN? Go 1.25.x loads such a DLL and resolves its symbols
  # but never runs init(), leaving the runtime dead (golang/go#75949, fixed in 1.26)
  # — so the spike asserts Go behaviour, not merely that the library loaded.
  spike-windows:
    name: Go-in-LoadLibrary spike (Windows, R1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.4' }
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build ts_shim.dll (cgo via mingw-w64)
        shell: pwsh
        run: |
          # Runner images move mingw around and ship more than one gcc, so discover
          # it rather than hardcoding, and verify the target triple: cgo needs a real
          # mingw-w64 gcc, and a stray clang-cl or MSYS (non-mingw) gcc would emit
          # objects the Go linker cannot use.
          $candidates = @(
            "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe",
            "C:\msys64\mingw64\bin\gcc.exe",
            "C:\mingw64\bin\gcc.exe",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\gcc.exe"
          )
          $onPath = Get-Command gcc -ErrorAction SilentlyContinue
          if ($onPath) { $candidates = @($onPath.Source) + $candidates }
          $gcc = $null
          foreach ($c in $candidates) {
            if ($c -and (Test-Path $c)) {
              $triple = (& $c -dumpmachine 2>$null)
              Write-Host "candidate $c -> $triple"
              if ($triple -match 'mingw') { $gcc = $c; break }
            }
          }
          if (-not $gcc) { throw "no mingw-w64 gcc found; tried: $($candidates -join ', ')" }
          Write-Host "using $gcc"
          "MINGW_CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:CC = $gcc
          $env:CGO_ENABLED = "1"
          $env:GOFLAGS = "-mod=mod"
          $env:GOTOOLCHAIN = "local"
          # Static libgcc keeps the shim self-contained: it is extracted alone to a
          # cache dir at runtime, so it must not need libgcc_s_seh-1.dll beside it.
          $env:CGO_LDFLAGS = "-static-libgcc"
          Push-Location shim/ts
          go build -buildmode=c-shared -o "$env:GITHUB_WORKSPACE\ts_shim.dll" .
          Pop-Location
      - name: Assert the shim has no non-system dependencies (zero-dependency NFR)
        shell: pwsh
        run: |
          $deps = & dumpbin /dependents ts_shim.dll | Out-String
          Write-Host $deps
          # Plain substring test: -match would treat these as regexes, and
          # 'libstdc++' is an invalid pattern (nested quantifier).
          foreach ($bad in @('libgcc', 'libwinpthread', 'libstdc++', 'msys-')) {
            if ($deps.ToLower().Contains($bad)) {
              throw "shim depends on $bad — it would not load on a clean machine"
            }
          }
      - name: Build the spike with MSVC and run it
        shell: pwsh
        run: |
          cl /nologo /W3 shim\spike_loadlibrary.c /Fe:spike.exe
          .\spike.exe "$env:GITHUB_WORKSPACE\ts_shim.dll" 1

  # How to embed the shim blob on Windows so it survives BOTH the loadable
  # extension (a DLL) and the static extension inside unittest.exe.
  #
  # An RCDATA resource was measured first and does NOT survive the static path:
  # nothing references the .res symbolically, so the linker never pulls it in.
  # That failure is silent and asymmetric — the shipped DLL works while every mesh
  # SQL test fails — which is exactly why it is probed rather than assumed.
  #
  # This probes the alternative: assemble the blob into a COFF object with .incbin
  # (the same mechanism the Unix build already uses for ELF/Mach-O) and check that
  # MSVC's link.exe consumes a mingw-produced, pure-data object.
  blob-embed:
    name: Blob-in-static-lib probe (Windows, COFF object)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure, build and run the probe
        shell: pwsh
        run: |
          $candidates = @(
            "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe",
            "C:\msys64\mingw64\bin\gcc.exe",
            "C:\mingw64\bin\gcc.exe"
          )
          $onPath = Get-Command gcc -ErrorAction SilentlyContinue
          if ($onPath) { $candidates = @($onPath.Source) + $candidates }
          $gcc = $null
          foreach ($c in $candidates) {
            if ($c -and (Test-Path $c)) {
              $triple = (& $c -dumpmachine 2>$null)
              if ($triple -match 'mingw') { $gcc = $c; break }
            }
          }
          if (-not $gcc) { throw "no mingw-w64 gcc found" }
          Write-Host "using $gcc"
          cmake -S test/win/blob_embed -B build-blob -G Ninja "-DMINGW_CC=$($gcc -replace '\\','/')"
          cmake --build build-blob
          .\build-blob\blob_probe.exe

  # The last unproven link in the Windows port. The standalone spike above shows Go
  # runs under an MSVC host, and the distribution pipeline shows the extension
  # builds with both shims embedded — but neither exercises the actual runtime path
  # INSIDE DuckDB: pull the blob out of the COFF object, write it to the
  # %LOCALAPPDATA% cache, LoadLibraryW it, and run Go. This job does exactly that.
  mesh-runtime-windows:
    name: Mesh activates at runtime (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.4' }
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build (MESH_BACKEND=both, mesh required)
        shell: pwsh
        env:
          MESH_BACKEND: both
          GEN: ninja
        run: |
          $candidates = @(
            "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\x86_64-w64-mingw32-gcc.exe",
            "C:\mingw64\bin\x86_64-w64-mingw32-gcc.exe",
            "C:\msys64\mingw64\bin\x86_64-w64-mingw32-gcc.exe"
          )
          foreach ($c in $candidates) { if (Test-Path $c) { $env:ERPL_MINGW_CC = $c; break } }
          if (-not $env:ERPL_MINGW_CC) { throw "no mingw-w64 gcc found" }
          Write-Host "ERPL_MINGW_CC=$env:ERPL_MINGW_CC"
          make release
      - name: Mesh SQL surface is present, and Go actually activates
        shell: pwsh
        run: |
          # Glob rather than hardcode: DUCKDB_PLATFORM varies by runner, and the
          # loadable artifact also appears under build/release/extension/.
          $ext = (Get-ChildItem -Recurse -Filter erpl_tunnel.duckdb_extension build/release |
                  Select-Object -First 1).FullName
          if (-not $ext) { throw "no erpl_tunnel.duckdb_extension under build/release" }
          Write-Host "extension: $ext"
          $duckdb = "build/release/duckdb.exe"

          # 1. the mesh SQL surface must exist in this build (it is #ifdef'd out of
          #    SSH-only builds, so this also proves mesh was really compiled in).
          $sql = @"
          LOAD '$($ext -replace '\\','/')';
          SELECT function_name FROM duckdb_functions() WHERE function_name LIKE 'tunnel_%' ORDER BY 1;
          "@
          $sql | & $duckdb -unsigned > out0.txt 2>&1
          $out = Get-Content out0.txt -Raw
          Write-Host $out
          foreach ($fn in @('tunnel_mesh_activate','tunnel_peers','tunnel_self')) {
            if ($out -notmatch [regex]::Escape($fn)) { throw "missing $fn — mesh was not compiled in" }
          }

          # 2. THE point of this job: activating a mesh extracts the embedded shim,
          #    LoadLibraryW's it and starts the Go runtime, all inside DuckDB.
          $sql2 = @"
          LOAD '$($ext -replace '\\','/')';
          PRAGMA tunnel_mesh_activate('tailscale');
          "@
          $sql2 | & $duckdb -unsigned > out2.txt 2>&1
          $out2 = Get-Content out2.txt -Raw
          Write-Host $out2
          if ($out2 -notmatch 'tailscale') { throw "tunnel_mesh_activate('tailscale') did not report success: $out2" }
          if ($out2 -match 'Error') { throw "tunnel_mesh_activate failed: $out2" }

          # 3. the shim really was written to the per-user cache
          $cache = "$env:LOCALAPPDATA\DataZoo\erpl-tunnel\shims"
          if (-not (Test-Path $cache)) { throw "shim cache $cache was never created" }
          Get-ChildItem -Recurse $cache | ForEach-Object { Write-Host "cached: $($_.FullName)" }

          # 4. one Go runtime per process: the second, different mesh must be refused
          $sql3 = @"
          LOAD '$($ext -replace '\\','/')';
          PRAGMA tunnel_mesh_activate('tailscale');
          PRAGMA tunnel_mesh_activate('netbird');
          "@
          $sql3 | & $duckdb -unsigned > out3.txt 2>&1
          $out3 = Get-Content out3.txt -Raw
          Write-Host $out3
          if ($out3 -notmatch 'start a new session') {
            throw "the single-mesh latch did not refuse the second mesh: $out3"
          }
          Write-Host "MESH-RUNTIME-WINDOWS OK - Go mesh activates inside DuckDB on Windows"
          # The last native command was duckdb exiting non-zero on the latch error we
          # deliberately provoke, and the pwsh wrapper propagates $LASTEXITCODE. Every
          # assertion above passed, so say so explicitly.
          exit 0

  # macOS shipped the mesh backends from the start but nothing ever verified them at
  # runtime there — the distribution matrix only proves it compiles and links. This
  # is the macOS twin of mesh-runtime-windows: does the embedded shim actually
  # extract, dlopen and start Go inside DuckDB on Mach-O?
  mesh-runtime-macos:
    name: Mesh activates at runtime (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.4' }
      - name: Install build deps
        run: brew install ninja
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - name: Build (MESH_BACKEND=both)
        env: { MESH_BACKEND: both, GEN: ninja }
        run: make debug
      - name: Lazy-dlopen / zero-Go proof
        run: make lazy_load_test
      - name: Single-mesh latch proof
        run: make latch_test

  mesh-e2e:
    name: Lazy-load, latch & Headscale enrollment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # Build with BOTH mesh shims so the cross-mesh latch can be exercised.
      - name: Build (MESH_BACKEND=both)
        env: { MESH_BACKEND: both, GEN: ninja }
        run: make debug

      - name: Lazy-dlopen / zero-Go proof
        run: make lazy_load_test

      - name: Single-mesh latch proof
        run: make latch_test

      - name: Real Tailscale enrollment via Headscale
        run: |
          make mesh_up
          make mesh_e2e
          make mesh_down

  tailscale-dataplane:
    name: Tailscale data plane (Tier 2, real WireGuard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      # Release build so node A's container has no asan dependency.
      - name: Build release (MESH_BACKEND=tailscale)
        env: { MESH_BACKEND: tailscale, GEN: ninja }
        run: make release
      # Node B is the official tailscale daemon with kernel TUN; node A is our
      # extension in a container on the same subnet (direct WireGuard).
      - name: Tailscale data-plane test
        run: |
          BASE_IMAGE=ubuntu:24.04 \
          DUCKDB_BIN=build/release/duckdb \
          make ts_dataplane

  # The acceptance test for tunnel_export: a peer on the tailnet runs SQL inside
  # our DuckDB over the quack protocol. This is the export direction end to end —
  # nothing else in CI proves a peer can reach INTO the extension's process.
  quack-over-tailscale:
    name: quack over Tailscale (tunnel_export acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - name: Build release (MESH_BACKEND=tailscale)
        env: { MESH_BACKEND: tailscale, GEN: ninja }
        run: make release
      # quack needs DuckDB >= 1.5.2, so this job is the one that depends on the
      # extension repository being reachable. The script tries `core` before
      # `core_nightly`: quack is in both, but not for the same DuckDB versions —
      # at v1.5.5 core_nightly 404s and core serves it.
      # The mesh-only SQL assertions. They are gated on ERPL_TUNNEL_MESH precisely
      # so the musl SSH-only artifact in the release pipeline skips them; this is
      # the job that has a mesh build and therefore must actually run them.
      - name: Mesh-only SQL assertions
        env: { ERPL_TUNNEL_MESH: '1' }
        run: build/release/test/unittest --test-dir . test/sql/tunnel_export_mesh.test
      - name: quack over the tailnet
        run: |
          BASE_IMAGE=ubuntu:24.04 \
          DUCKDB_BIN=build/release/duckdb \
          make quack_export

  # The export acceptance test on NetBird. Separate from the Tailscale job because
  # NetBird adds inbound access policy — default-deny in BOTH directions — which the
  # Tailscale run never exercises. An export can be functional and still unreachable.
  quack-over-netbird:
    name: quack over NetBird (tunnel_export acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - name: Build release (MESH_BACKEND=netbird)
        env: { MESH_BACKEND: netbird, GEN: ninja }
        run: make release
      - name: Build the store seeder
        run: make nb_seeder
      - name: quack over the NetBird overlay
        run: |
          BASE_IMAGE=ubuntu:24.04 \
          DUCKDB_BIN=build/release/duckdb \
          make quack_export_netbird

  netbird-dataplane:
    name: NetBird data plane (Tier 2, real WireGuard, no IdP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
      - name: Build release (MESH_BACKEND=netbird)
        env: { MESH_BACKEND: netbird, GEN: ninja }
        run: make release
      - name: Build the store seeder
        run: make nb_seeder
      # Self-hosted NetBird (management IdpManagerConfig:none + seeded store, signal,
      # relay). Both nodes force NetBird's userspace firewall so the ACL applies
      # without the ip_set_hash_net kernel module (see docs/guides/troubleshooting.md).
      - name: NetBird data-plane test
        run: |
          BASE_IMAGE=ubuntu:24.04 \
          DUCKDB_BIN=build/release/duckdb \
          make nb_dataplane
